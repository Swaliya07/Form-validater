<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Validation (No * Allowed)</title>
  <style>
    body {
      background: #f7fafb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
    }
    #myform {
      background: #bbbfb1;
      border-radius: 8px;
      padding: 35px;
      font-size: 18px;
      box-shadow: 0px 8px 16px 5px rgba(0,0,0,0.2);
      width: 280px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1.8px solid #161313;
      border-radius: 6px;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }
    input.error {
      border-color: red;
      background: #fff1f1;
    }
    input.success {
      border-color: #28a745;
      background: #f4fff6;
    }
    .error-text {
      color: red;
      font-size: 14px;
      margin: 0;
      height: 18px;
      transition: 0.3s;
    }
    .success-icon {
      color: #28a745;
      font-weight: bold;
      float: right;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      background: #1a1515;
      transition: 0.3s;
    }
    button:hover { background: #000; }
  </style>
</head>
<body>

  <form id="myform">
    <div>
      <input id="name" placeholder="Enter your name">
      <p class="error-text" id="nameError"></p>
    </div>
    <div>
      <input id="email" placeholder="Enter your email">
      <p class="error-text" id="emailError"></p>
    </div>
    <div>
      <input id="password" type="password" placeholder="Enter your password">
      <p class="error-text" id="passwordError"></p>
    </div>

    <button type="submit">Submit</button>
  </form>

  <script> 
           // LOGIC 1
    document.addEventListener("DOMContentLoaded", () => {
      let form = document.getElementById("myform");
      let name = document.getElementById("name");
      let email = document.getElementById("email");
      let password = document.getElementById("password");
      let nameError = document.getElementById("nameError");
      let emailError = document.getElementById("emailError");
      let passwordError = document.getElementById("passwordError");

      let star = /[\u002A\uFE61\uFF0A\u204E\u2217\u2731]/;
      let mail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  
      let validate = (input, condition, message, errorBox) => {
        if (condition) {
          input.classList.add("error");
          input.classList.remove("success");
          errorBox.textContent = message;
        } else {
          input.classList.remove("error");
          input.classList.add("success");
          errorBox.textContent = "✅";
          errorBox.classList.add("success-icon");
        }
      };

      name.addEventListener("input", () => {
        validate(name, !name.value.trim(), "⚠️ Name cannot be empty!", nameError);
        validate(name, star.test(name.value), "❌ * not allowed in name!", nameError);
        validate(/[0-9]/.test(val), "❌ Numbers are not allowed in name!", nameError);
 
  })
     });
     email.addEventListener("input", () => {
        validate(email, !email.value.trim(), "⚠️ Email required!", emailError);
        validate(email, email.value && !mail.test(email.value), "❌ Invalid email!", emailError);
      });

      password.addEventListener("input", () => {
        validate(password, !password.value.trim(), "⚠️ Password required!", passwordError);
        validate(password, password.value && password.value.length < 6, "❌ Min 6 characters!", passwordError);
      });

      form.addEventListener("submit", e => {
        e.preventDefault();
        if (
          !name.classList.contains("error") &&
          !email.classList.contains("error") &&
        !password.classList.contains("error") &&
          name.value && email.value && password.value
        ) {
          alert("✅ Form successfully submitted!");
        } else {
          alert("⚠️ Please fix the highlighted fields!");
        }
    });


  </script>

</body>
</html>
