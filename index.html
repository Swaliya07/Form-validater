
 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basic Validation</title>

  <style>
    body{
      background: #89abb7;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family:Arial, Helvetica, sans-serif;
    }
    #myform{
      background:#e8f7c9;
      border-radius: 8px;
      padding: 35px;
      font-size: 15px;
      box-shadow: 0px 8px 16px 5px rgba(0,0,0,0.2);
      width: 320px;
    }
    input{
      width: 80%;
      padding: 18px;
      margin: 10px 0;
      border: 2px solid rgb(32, 28, 28);
      border-radius: 6px;
      font-size: 20px;
    }
    .error{
      color: red;
      font-size: 18px;
      margin: 0;
      height: 20px;
    }
    button{
      width: 100%;
      padding: 12px;
      font-size: 20px;
      border: none;
      border-radius: 8px;
      margin-top: 10px;
      color: white;
      cursor: pointer;
      background: #1a1515;
    }
    #valid{
      font-size: 35px;
      color: black;
      margin-top: 20px;
      padding: 8px;
    }
  </style>

</head>
<body>

  <form id="myform">
    <h1 id="valid">Form Validater</h1>

    <input id="name" placeholder="Enter your name">
    <p class="error" id="nameError"></p>

    <input id="email" placeholder="Enter your email">
    <p class="error" id="emailError"></p>

    <input id="password" type="password" placeholder="Enter your password">
    <p class="error" id="passwordError"></p>

    <button type="submit">Submit</button>
  </form>


<script>
document.addEventListener("DOMContentLoaded", ()=>{

  let form = document.querySelector("#myform");
  let name = document.querySelector("#name");
  let email = document.querySelector("#email");
  let password = document.querySelector("#password");

  let nameError = document.querySelector("#nameError");
  let emailError = document.querySelector("#emailError");
  let passwordError = document.querySelector("#passwordError");

  let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  form.addEventListener("submit", (e)=>{

    e.preventDefault();

    // reset errors
    nameError.textContent = "";
    emailError.textContent = "";
    passwordError.textContent = "";

    let valid = true;
    let n = name.value.trim();
    let em = email.value.trim();
    let pw = password.value.trim();

    // NAME Validation
    if (!n) {
      nameError.textContent = "Please enter your full name.";
      valid = false;
    }
    else if (n.length < 3) {
      nameError.textContent = "Name must be at least 3 letters.";
      valid = false;
    }
    else if (/\*/.test(n)) {
      nameError.textContent = "Asterisk (*) is not allowed.";
      valid = false;
    }
    else if (/[0-9]/.test(n)) {
      nameError.textContent = "Numbers are not allowed in name.";
      valid = false;
    }
    else if (/[^a-zA-Z ]/.test(n)) {
      nameError.textContent = "Special characters are not allowed.";
      valid = false;
    }

    // EMAIL Validation
    if (!em) {
      emailError.textContent = "Please enter your email.";
      valid = false;
    }
    else if (!emailRegex.test(em)) {
      emailError.textContent = "Enter a valid email.";
      valid = false;
    }

    // PASSWORD Validation
    if (!pw) {
      passwordError.textContent = "Please enter a password.";
      valid = false;
    }
    else if (pw.length < 6) {
      passwordError.textContent = "Password must be 6+ characters.";
      valid = false;
    }

    if (valid) {
      alert("Form submitted successfully!");
    }

  });
});
</script>

</body>
</html>
